appId: com.smc.copilot
productName: SMC-Copilot
directories:
  buildResources: build
# Keep default **/* for dependency collection, but strip non-runtime project
# trees. A previous pack included source/docs/.cursor (≈43k entries / 648MB)
# and produced asar offset/integrity corruption (package.json unreadable).
# Do NOT use a top-level "!**/*" allowlist — electron-builder also applies
# files patterns to nodeModuleFilePatterns and would drop all dependencies.
files:
  - out/**/*
  - package.json
  - resources/**/*
  - "!out/**/*.map"
  - "!**/.vscode/*"
  - "!**/.cursor{,/**/*}"
  - "!**/.agents{,/**/*}"
  - "!**/.claude{,/**/*}"
  - "!**/.codex{,/**/*}"
  - "!**/.sandbox{,/**/*}"
  - "!src{,/**/*}"
  - "!components{,/**/*}"
  - "!hooks{,/**/*}"
  - "!utils{,/**/*}"
  - "!tests{,/**/*}"
  - "!scripts{,/**/*}"
  - "!docs{,/**/*}"
  - "!prd{,/**/*}"
  - "!lat.md{,/**/*}"
  - "!spikes{,/**/*}"
  - "!artifacts{,/**/*}"
  - "!changelogs{,/**/*}"
  - "!assets{,/**/*}"
  - "!build{,/**/*}"
  - "!dist{,/**/*}"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml,package-lock.json}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,components.json,vitest.config.ts,eslint.config.mjs}"
  - "!*.md"
  - "!AGENTS.md"
  - "!CLAUDE.md"
  - "!CONTRIBUTING*.md"
  - "!Development.md"
  - "!BASELINE_PASS.md"
  - "!KANBAN_GAP_REPORT.md"
  - "!PROFILE_MODAL_HANDOFF.md"
  - "!LICENSE"
asarUnpack:
  - resources/**
  - node_modules/better-sqlite3/build/Release/*.node
extraResources:
  - from: resources/work-build-info.json
    to: work-build-info.json
  - from: resources
    to: .
    filter:
      - work-registry-config.json
      - work-knowledge-config.json
  - from: resources/hermes-native
    to: hermes-native
  - from: resources/hermes-policy
    to: hermes-policy
  # Native Bootstrap installer (staged by scripts/stage-hermes-bootstrap.mjs).
  # When absent at pack time, runtime soft-skips if CLI + gateway are healthy.
  - from: resources/hermes-bootstrap
    to: hermes-bootstrap
    filter:
      - install.ps1
win:
  executableName: smc-copilot
  icon: build/icon.ico
  target:
    - nsis
nsis:
  artifactName: smc-copilot-${version}-setup.${ext}
  shortcutName: SMC-Copilot
  uninstallDisplayName: SMC-Copilot
  include: installer.nsh
  createDesktopShortcut: always
  createStartMenuShortcut: true
  oneClick: false
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: true
mac:
  artifactName: ${name}-${version}-${arch}-${os}.${ext}
  icon: build/icon.icns
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
    - rpm
  maintainer: electronjs.org
  vendor: SMC
  category: Utility
  synopsis: Self-improving AI assistant desktop app
  description: >-
    SMC Copilot is a native desktop app for installing, configuring, and chatting
    with Hermes Agent — a self-improving AI assistant with tool use, multi-platform
    messaging, and a closed learning loop.
appImage:
  artifactName: ${name}-${version}.${ext}
deb:
  # Run chmod 4755 on chrome-sandbox so Electron's setuid sandbox helper
  # works on modern Linux distros that disable unprivileged user
  # namespaces (Ubuntu 24.04+, etc.). Closes #395.
  afterInstall: build/linux-after-install.sh
rpm:
  artifactName: ${name}-${version}.${ext}
  # Same SUID fix for .rpm consumers (Fedora 40+ also restricts userns).
  afterInstall: build/linux-after-install.sh
npmRebuild: false
publish:
  provider: generic
  url: ${env.SMC_WORK_UPDATE_URL}
  channel: latest
