name: Work CI

on:
  push:
    paths:
      - "apps/work/**"
      - "infra/release-server/**"
      - ".github/workflows/work-ci.yml"
      - ".github/workflows/work-release.yml"
  pull_request:
    paths:
      - "apps/work/**"
      - "infra/release-server/**"
      - ".github/workflows/work-ci.yml"
      - ".github/workflows/work-release.yml"

concurrency:
  group: work-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  work:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/work
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/work/package-lock.json
      - name: Install
        run: npm ci
      - name: Guard
        run: npm run guard
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
