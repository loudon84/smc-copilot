name: Integration CI

on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *"
  push:
    paths:
      - "apps/desktop/src/main/copilot-runtime-client/**"
      - "services/runtime/src/api/**"
      - "contracts/**"
      - "packages/runtime-client-ts/**"
      - "tools/integration/**"
      - ".github/workflows/integration-ci.yml"
  pull_request:
    paths:
      - "apps/desktop/src/main/copilot-runtime-client/**"
      - "services/runtime/src/api/**"
      - "contracts/**"
      - "packages/runtime-client-ts/**"
      - "tools/integration/**"

jobs:
  integration-l1-l2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: astral-sh/setup-uv@v5
      - run: npm ci
      - working-directory: packages/runtime-client-ts
        run: npm ci
      - working-directory: services/runtime
        run: uv sync --extra dev
      - working-directory: services/runtime
        run: uv run alembic upgrade head
      - name: Integration L1+L2
        run: npx nx run integration-e2e:test
        env:
          RUNTIME_REQUIRE_AUTH: "false"
          COPILOT_REQUIRE_TOKEN: "false"
          INTEGRATION_LEVEL: all

  integration-l3-windows:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: astral-sh/setup-uv@v5
      - run: npm ci
      - working-directory: packages/runtime-client-ts
        run: npm ci
      - working-directory: services/runtime
        run: uv sync --extra dev
      - working-directory: services/runtime
        run: uv run alembic upgrade head
      - name: Integration L3 Windows
        run: npx nx run integration-e2e:test-l3
        env:
          RUNTIME_REQUIRE_AUTH: "false"
          COPILOT_REQUIRE_TOKEN: "false"
          INTEGRATION_L3: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-l3
          path: artifacts/integration-l3.json
          if-no-files-found: ignore
