name: Salt Control CI

on:
  push:
    paths:
      - "services/salt-control/**"
      - "contracts/salt-control-api/**"
      - "infra/salt/**"
      - ".github/workflows/salt-control-ci.yml"
  pull_request:
    paths:
      - "services/salt-control/**"
      - "contracts/salt-control-api/**"
      - "infra/salt/**"
      - ".github/workflows/salt-control-ci.yml"

jobs:
  salt-control:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: salt_control_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/salt_control_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Sync salt-control
        working-directory: services/salt-control
        run: uv sync --extra dev
      - name: Ruff
        working-directory: services/salt-control
        run: uv run ruff check .
      - name: Ruff format
        working-directory: services/salt-control
        run: uv run ruff format --check .
      - name: Pytest
        working-directory: services/salt-control
        run: |
          set -euo pipefail
          OUT=$(uv run pytest -q --tb=line)
          echo "$OUT"
          # Alembic cycle must execute against the CI Postgres service — never skip.
          if echo "$OUT" | grep -E 'tests/test_alembic_cycle.py.*(SKIPPED|skipped)'; then
            echo "alembic integration test was skipped — failing CI"
            exit 1
          fi
          if ! echo "$OUT" | grep -E 'passed'; then
            echo "pytest produced no passed summary"
            exit 1
          fi
      - name: Alembic upgrade head
        working-directory: services/salt-control
        run: uv run alembic upgrade head
      - name: Assert alembic integration ran
        working-directory: services/salt-control
        run: |
          uv run pytest tests/test_alembic_cycle.py -q --tb=short
          # Explicit non-skip assertion for CI logs.
          python - <<'PY'
          import os
          url = os.environ.get("DATABASE_URL", "")
          assert url.startswith("postgresql"), f"DATABASE_URL missing/invalid: {url!r}"
          print("ok: DATABASE_URL present for alembic integration")
          PY
      - name: Alembic upgrade → downgrade → upgrade
        working-directory: services/salt-control
        run: |
          uv run alembic downgrade -1
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: OpenAPI export drift
        working-directory: services/salt-control
        run: uv run pytest tests/test_openapi_export.py -q
      - name: v2.4.1 evidence remains not_proven
        run: |
          python - <<'PY'
          from pathlib import Path
          status = Path("docs/salt/evidence/v2.4.1/STATUS.md").read_text(encoding="utf-8")
          assert "NO-GO" in status
          assert "manual_gate / not_proven" in status
          final = Path("docs/salt/evidence/v2.4.1/ring0/TEMPLATE/final-go-no-go.json").read_text(encoding="utf-8")
          assert '"status": "not_proven"' in final or '"status":"not_proven"' in final
          assert "proven" not in final.split("not_proven")[0]  # crude guard
          v24 = Path("docs/salt/evidence/v2.4/STATUS.md").read_text(encoding="utf-8")
          assert "manual_gate / not_proven" in v24
          print("ok: live gates remain not_proven")
          PY
      - name: v2.3 superseded index present
        run: |
          test -f docs/salt/evidence/v2.3/SUPERSEDED.md
          grep -q "superseded" docs/salt/evidence/v2.3/SUPERSEDED.md
      - name: Phase 7 remains manual_gate
        run: |
          python - <<'PY'
          from pathlib import Path
          status = Path("docs/salt/evidence/v2.4.1/STATUS.md").read_text(encoding="utf-8")
          assert "7 Live Ring 0 (human only)" in status
          assert "manual_gate / not_proven" in status
          assert "NO-GO" in status
          # Cursor/CI must not auto-complete Phase 7.
          for line in status.splitlines():
              if "7 Live Ring 0" in line:
                  assert "implemented" not in line.split("|")[-2]
          print("ok: phase 7 remains manual")
          PY

  work-ring0:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/work
    env:
      NX_DAEMON: "false"
      VITEST_CACHE_DIR: ${{ github.workspace }}/.vitest-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        working-directory: .
        run: npm ci --ignore-scripts
      - name: Ring 0 directed vitest
        run: |
          mkdir -p "$VITEST_CACHE_DIR"
          npm exec vitest run -- tests/enterprise-salt-mode.test.ts tests/hermes-availability-backend.test.ts tests/runtime-adapter.test.ts tests/chat-messages.test.ts tests/chat-runs.test.ts tests/sessions-history-items.test.ts tests/session-attachment-store.test.ts src/main/files/attachment-adapter.test.ts src/main/files/file-security.test.ts

  infra-salt-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Sync infra/salt
        working-directory: infra/salt
        run: uv sync --extra dev
      - name: Ruff infra/salt
        working-directory: infra/salt
        run: uv run ruff check .
      - name: Pytest infra/salt
        working-directory: infra/salt
        run: uv run pytest -q
      - name: Production guards
        run: python infra/salt/scripts/check-production-guards.py
      - name: Migration inventory
        working-directory: infra/salt
        run: uv run python ../../scripts/salt-migration-inventory.py --check
      - name: v2.4 single-master deploy list excludes failover
        run: |
          python - <<'PY'
          from pathlib import Path
          deploy = Path("infra/salt/master/deploy-list-v24-single-master.txt")
          assert deploy.is_file(), "missing deploy-list-v24-single-master.txt"
          text = deploy.read_text(encoding="utf-8")
          assert "failover.conf" not in text, "failover.conf must not be in v2.4 single-master deploy list"
          print("ok: failover.conf excluded")
          PY
