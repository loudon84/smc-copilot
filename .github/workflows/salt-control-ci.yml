name: Salt Control CI

on:
  push:
    paths:
      - "services/salt-control/**"
      - "contracts/salt-control-api/**"
      - "infra/salt/**"
      - ".github/workflows/salt-control-ci.yml"
  pull_request:
    paths:
      - "services/salt-control/**"
      - "contracts/salt-control-api/**"
      - "infra/salt/**"
      - ".github/workflows/salt-control-ci.yml"

jobs:
  salt-control:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: salt_control_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/salt_control_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Sync salt-control
        working-directory: services/salt-control
        run: uv sync --extra dev
      - name: Ruff
        working-directory: services/salt-control
        run: uv run ruff check .
      - name: Ruff format
        working-directory: services/salt-control
        run: uv run ruff format --check .
      - name: Pytest
        working-directory: services/salt-control
        run: uv run pytest -q
      - name: Alembic upgrade head
        working-directory: services/salt-control
        run: uv run alembic upgrade head
      - name: Alembic upgrade → downgrade → upgrade
        working-directory: services/salt-control
        run: |
          uv run alembic downgrade -1
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: OpenAPI export drift
        working-directory: services/salt-control
        run: uv run pytest tests/test_openapi_export.py -q

  infra-salt-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Sync infra/salt
        working-directory: infra/salt
        run: uv sync --extra dev
      - name: Ruff infra/salt
        working-directory: infra/salt
        run: uv run ruff check .
      - name: Pytest infra/salt
        working-directory: infra/salt
        run: uv run pytest -q
      - name: Production guards
        run: python infra/salt/scripts/check-production-guards.py
      - name: Migration inventory
        working-directory: infra/salt
        run: uv run python ../../scripts/salt-migration-inventory.py --check
      - name: v2.4 single-master deploy list excludes failover
        run: |
          python - <<'PY'
          from pathlib import Path
          deploy = Path("infra/salt/master/deploy-list-v24-single-master.txt")
          assert deploy.is_file(), "missing deploy-list-v24-single-master.txt"
          text = deploy.read_text(encoding="utf-8")
          assert "failover.conf" not in text, "failover.conf must not be in v2.4 single-master deploy list"
          print("ok: failover.conf excluded")
          PY
