name: OPSI Package CI

on:
  push:
    paths:
      - "infra/opsi/**"
      - "infra/windows/hermes-agent/**"
      - "contracts/opsi/*.schema.json"
      - "tools/release/**"
      - ".github/workflows/opsi-package-ci.yml"
  pull_request:
    paths:
      - "infra/opsi/**"
      - "infra/windows/hermes-agent/**"
      - "contracts/opsi/*.schema.json"
      - "tools/release/**"
      - ".github/workflows/opsi-package-ci.yml"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Product pytest
        run: python -m pytest infra/opsi/tests -q
      - name: Validate control.toml and package smoke
        run: python infra/opsi/products/smc-hermes-agent/packaging/makepackage.py --smoke
      - name: Schema examples
        run: python infra/opsi/tests/validate_schemas.py
      - name: Secret scan product tree
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path("infra/opsi")
          pat = re.compile(r"(api[_-]?key|secret|password|bearer\s+[A-Za-z0-9._-]{12,})", re.I)
          hits = []
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix.lower() in {".png", ".zip", ".opsi", ".sig"}:
                  continue
              if path.name.endswith("release-private-key.pem"):
                  hits.append(str(path))
                  continue
              text = path.read_text(encoding="utf-8", errors="replace")
              if pat.search(text) and "example" not in path.name.lower() and "redact" not in path.name.lower():
                  if "redact" in text.lower() or "forbidden" in text.lower() or "secret key" in text.lower():
                      continue
                  hits.append(str(path))
          assert hits == [], hits
          print("ok: no secrets in product tree")
          PY
      - name: Isolation vs Salt
        run: python scripts/check-opsi-isolation.py --base ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: V2 zero Product write RPC scan
        run: |
          python - <<'PY'
          import subprocess, sys
          result = subprocess.run(
              ["rg", "-n", "productPropertyState_updateObjects|productOnClient_updateObjects",
               "services/opsi-control/src/api/v2", "services/opsi-control/src/workers/command_dispatcher.py"],
              capture_output=True, text=True
          )
          if result.returncode == 0 and result.stdout.strip():
              print(result.stdout)
              sys.exit(1)
          print("ok: v2 paths have zero Product write RPCs")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: smc-hermes-agent-smoke
          path: infra/opsi/products/smc-hermes-agent/dist/*.smoke.zip
          if-no-files-found: error

  pester:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pester adapter contracts
        shell: pwsh
        run: Invoke-Pester -Path infra/opsi/tests/SmcHermesAgent.Tests.ps1,infra/windows/hermes-agent/tests/SmcHermesManaged.Tests.ps1,infra/windows/hermes-agent/tests/Installer.Tests.ps1,infra/windows/hermes-agent/tests/HostOperations.Tests.ps1 -EnableExit

  builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Smoke package is not .opsi
        run: |
          python infra/opsi/products/smc-hermes-agent/packaging/makepackage.py --smoke --dest /tmp/opsi-smoke
          ls /tmp/opsi-smoke/*.smoke.zip
          test ! -e /tmp/opsi-smoke/*.opsi
      - name: Hermes release builder pytest
        run: uv run --project services/opsi-control pytest tools/release/tests/test_hermes_builder.py tools/release/tests/test_client_release.py -q
      - name: Verify hermes-installer is release SOT
        run: |
          python - <<'PY'
          from pathlib import Path
          build_script = Path("scripts/build-client-release.ps1")
          assert build_script.exists(), "build-client-release.ps1 missing"
          content = build_script.read_text(encoding="utf-8")
          assert "hermes-installer" in content.lower() or "OpsiClientInstaller" in content, \
              "build script must reference hermes-installer stage"
          print("ok: hermes-installer is release SOT")
          PY
      - name: Installer no-.NET / offline source guard
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("infra/windows/hermes-agent/installer")
          pattern = re.compile(
              r"SmcHermesInstallerHost|ManagedBootstrapperApplicationHost|DotNetCoreSearch|NetFx|"
              r"dotnet-runtime|dotnet-hosting|Microsoft\.NETCore|RemotePayload|DownloadUrl|"
              r"Compress-Archive"
          )
          hits = []
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix.lower() not in {".wxs", ".ps1", ".psm1", ".xml", ".json"}:
                  continue
              text = path.read_text(encoding="utf-8", errors="replace")
              for i, line in enumerate(text.splitlines(), 1):
                  if pattern.search(line):
                      hits.append(f"{path}:{i}:{line.strip()}")
          if hits:
              print("\n".join(hits))
              sys.exit(1)
          core = Path("infra/windows/hermes-agent/installer/InstallerCore.psm1").read_text(encoding="utf-8")
          if "verify_release_v2.py" in core or "python $verifier" in core:
              print("InstallerCore still calls Endpoint Python verifier")
              sys.exit(1)
          print("ok: installer sources have no .NET/host/ZIP-rename/Endpoint-python paths")
          PY

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install WiX CLI
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix --version
          wix extension add WixToolset.BootstrapperApplications.wixext
      - name: Build native Burn + MSI (smoke payload)
        shell: pwsh
        run: |
          $out = "infra/windows/hermes-agent/installer/dist"
          $exe = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File infra/windows/hermes-agent/installer/build.ps1 `
            -ReleaseVersion "0.22.0-smc.1" `
            -OutputDir $out `
            -Smoke
          $exe = [string]($exe | Select-Object -Last 1)
          if (-not (Test-Path -LiteralPath $exe)) { throw "installer exe missing: $exe" }
          $msi = Join-Path $out "smc-hermes-agent_0.22.0-smc.1_windows-amd64.msi"
          if (-not (Test-Path -LiteralPath $msi)) { throw "installer msi missing" }
          $pe = [System.IO.File]::ReadAllBytes($exe)
          if ($pe.Length -lt 2 -or $pe[0] -ne 0x4D -or $pe[1] -ne 0x5A) { throw "exe is not PE" }
          $mb = [System.IO.File]::ReadAllBytes($msi)
          if ($mb.Length -lt 2 -or $mb[0] -ne 0xD0 -or $mb[1] -ne 0xCF) { throw "msi invalid" }
          if ((Get-Item -LiteralPath $exe).Length -le (Get-Item -LiteralPath $msi).Length) {
            throw "bundle does not embed MSI"
          }
          if (Test-Path -LiteralPath (Join-Path $out "verify_release_v2.py")) {
            throw "Endpoint must not ship verify_release_v2.py"
          }
          $sig = Get-AuthenticodeSignature -LiteralPath $exe
          Write-Host "authenticode=$($sig.Status)"
          if ($sig.Status -eq "Valid") {
            throw "smoke/test builds must not be production-signed liveEligible artifacts"
          }
          Write-Host "ok: native installer PE+MSI built (smoke provenance)"
      - name: No-.NET string scan on installer sources
        shell: pwsh
        run: |
          $pattern = 'SmcHermesInstallerHost|ManagedBootstrapperApplicationHost|DotNetCoreSearch|NetFx|dotnet-runtime|dotnet-hosting|Microsoft.NETCore|RemotePayload|DownloadUrl'
          $hits = Get-ChildItem -Path infra/windows/hermes-agent/installer -File |
            Where-Object { $_.Extension -in '.wxs', '.ps1', '.psm1' } |
            Select-String -Pattern $pattern
          if ($hits) { $hits | ForEach-Object { $_.ToString() }; exit 1 }
          Write-Host "ok: no-.NET guard passed"
