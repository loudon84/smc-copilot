name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check:workspaces-no-tailwind
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e:electron
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-electron-artifacts
          path: |
            playwright-report/
            test-results/e2e-electron/
          if-no-files-found: ignore
