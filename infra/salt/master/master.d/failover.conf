# Production multimaster Active/Passive failover (Salt Minion side settings mirrored here for Master ops docs).
# Minions use the same master list via client/windows/templates/smc-minion.conf.
#
# Placeholders — replace with enterprise DNS before deploy:
#   salt-a.internal  (Master A)
#   salt-b.internal  (Master B)

master:
  - salt-a.internal
  - salt-b.internal
master_type: failover
random_master: True
master_alive_interval: 60
verify_master_pubkey_sign: True
