# Versioned readonly file_roots for production Masters.
# SLS / Extension releases are published as immutable trees; do not edit live on Master.
#
# Example layout (ops-managed, not git-checked PKI):
#   file_roots:
#     base:
#       - /srv/salt/releases/current
#     versions:
#       - /srv/salt/releases
#
# Production Master must pin `current` to a signed release digest.
# Direct edits under /srv/salt on a live Master are forbidden — republish a new release instead.

pillar_safe_render_error: True
