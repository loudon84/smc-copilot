# Production salt-api + eAuth (v2.3). Deploy to Master 192.168.102.104 by ops.
# TLS only; certificates from enterprise/internal CA. Never commit private keys.

rest_cherrypy:
  port: 8000
  ssl_crt: /etc/salt/pki/api/salt-api.crt
  ssl_key: /etc/salt/pki/api/salt-api.key
  disable_ssl: False
  webhook_disable_auth: False

# external_auth is configured in eauth.conf — keep function whitelist minimal.
