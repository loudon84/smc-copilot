# External pillar: Salt Control Desired State only. No mock fallback in production.
# Token file and trusted public key are host paths — never commit secret values.
ext_pillar:
  - smc_external:
      salt_control_url: ${SMC_SALT_CONTROL_URL}
      token_file: ${SMC_SALT_CONTROL_TOKEN_FILE}
      trusted_key_id: ${SMC_ARTIFACT_KEY_ID}
      trusted_public_key_file: ${SMC_ARTIFACT_PUBLIC_KEY_FILE}
