# Minimal eAuth for Salt Control service account (v2.3).
# Forbidden: shell/cmd/powershell execution modules.

external_auth:
  pam:
    salt_control:
      - '@runner'
      - '@wheel'
      - 'ep_*':
          - test.ping
          - saltutil.sync_all
          - saltutil.refresh_pillar
          - state.show_highstate
          - state.highstate
          - sys.list_modules
          - smc_hermes.*
          - smc_handover.*

# Wheel key management is granted via @wheel for salt_control only.
# auto_accept remains false (see security.conf). Manual salt-key -a is break-glass + audit.
