# Minimal eAuth for Salt Control service account (v2.4.1).
# Forbidden: shell/cmd/powershell execution modules.
# Wheel/runner limited to explicit key ops — no blanket @wheel/@runner in production.

external_auth:
  pam:
    salt_control:
      - '@runner':
          - manage.status
      - '@wheel':
          - key.list_all
          - key.finger
          - key.accept
          - key.delete
      - 'ep_*':
          - test.ping
          - saltutil.sync_all
          - saltutil.refresh_pillar
          - state.show_highstate
          - state.highstate
          - sys.list_modules
          - smc_hermes.loader_status
          - smc_hermes.inspect
          - smc_hermes.health
          - smc_hermes.doctor
          - smc_hermes.install
          - smc_hermes.upgrade
          - smc_hermes.rollback
          - smc_hermes.apply_config
          - smc_hermes.restart
          - smc_hermes.gateway_restart
          - smc_hermes.gateway_start
          - smc_hermes.gateway_stop
          - smc_handover.commit
          - smc_handover.rollback
          - smc_handover.migrate
          - smc_handover.remigrate

# auto_accept remains false (see security.conf). Manual salt-key -a is break-glass + audit.
