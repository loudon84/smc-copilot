# Optional Salt Master lab. Unit tests do not require this stack.
services:
  salt-master:
    image: saltstack/salt:3007
    hostname: salt-master
    environment:
      SALT_MASTER_CONFIG: |
        auto_accept: True
        file_roots:
          base:
            - /srv/salt
        pillar_roots:
          base:
            - /srv/pillar
        ext_pillar:
          - smc_external: {}
    volumes:
      - ../states:/srv/salt:ro
      - ../pillar:/srv/pillar:ro
      - ../extensions/_modules:/srv/salt/_modules:ro
      - ../extensions/_states:/srv/salt/_states:ro
      - ../extensions/_grains:/srv/salt/_grains:ro
      - ../extensions/_returners:/srv/salt/_returners:ro
      - ../extensions/_pillar:/srv/salt/_pillar:ro
      - ../extensions/_beacons:/srv/salt/_beacons:ro
      - ./master.d:/etc/salt/master.d:ro
      - ./returns:/var/log/smc-returns
    ports:
      - "4505:4505"
      - "4506:4506"
