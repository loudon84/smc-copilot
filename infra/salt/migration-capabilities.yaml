schema: smc.salt-migration-capabilities.v2
notes: >
  Only status=verified FULL counts as weight 1.0. pairings and role_library stay PARTIAL.
  Tests listed must exist or inventory downgrades the item.
  Blockers drive codeGate/liveGate. Cursor/CI may set implementationStatus=fixed;
  verificationStatus=proven is manual signoff only.

blockers:
  - id: SALT-LOADER-001
    severity: P0
    implementationStatus: fixed
    verificationStatus: not_proven
    affectedCapabilities: [runtime, doctor_service, diagnostics]
    tests:
      - infra/salt/tests/test_salt_loader_contract.py
      - infra/salt/tests/test_loader_dunder.py
  - id: PILLAR-CONTRACT-001
    severity: P0
    implementationStatus: fixed
    verificationStatus: not_proven
    affectedCapabilities: [sync, resources, runtime_sync_service]
    tests:
      - infra/salt/tests/test_external_pillar_contract.py
  - id: JOB-CONTRACT-001
    severity: P0
    implementationStatus: fixed
    verificationStatus: not_proven
    affectedCapabilities: [runtime_job_service, update_service]
    tests:
      - services/salt-control/tests/test_invocation_contract.py
  - id: IDENTITY-BINDING-001
    severity: P1
    implementationStatus: fixed
    verificationStatus: not_proven
    affectedCapabilities: [endpoint, desired_state_service]
    tests:
      - infra/salt/tests/test_minion_identity.py
      - services/salt-control/tests/test_desired_state.py

