[project]
name = "smc-salt-extensions"
version = "0.2.2"
description = "SMC Hermes Salt extensions (Endpoint Control Plane, PRD v2.2)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pyyaml>=6,<7",
  "httpx>=0.27,<1",
  "cryptography>=43,<46",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["extensions", "mock_backend", "client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "extensions", "extensions/_utils", "mock_backend", "client"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "N807"]
