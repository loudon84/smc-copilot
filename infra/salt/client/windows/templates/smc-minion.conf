# SMC Windows salt-minion drop-in (C:\ProgramData\Salt Project\Salt\conf\minion.d\smc.conf)
# Multimaster failover — replace placeholders with enterprise Master DNS.
master:
  - {{MASTER_A}}
  - {{MASTER_B}}
master_type: failover
random_master: True
master_alive_interval: 60
verify_master_pubkey_sign: True
id: {{ENDPOINT_ID}}
master_finger: {{MASTER_FINGERPRINT}}
log_level: info
startup_states: ''
# Production: auto_accept stays false on Masters; client never accepts keys.
