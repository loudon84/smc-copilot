server {
    listen 443 ssl;
    server_name _;

    root /srv/releases;
    autoindex off;
    server_tokens off;

    ssl_certificate /etc/nginx/certs/release.crt;
    ssl_certificate_key /etc/nginx/certs/release.key;

    location = /healthz {
        default_type text/plain;
        return 200 "OK\n";
    }

    location ~* /latest\.yml$ {
        limit_except GET HEAD {
            deny all;
        }

        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location ~* \.(exe|blockmap)$ {
        limit_except GET HEAD {
            deny all;
        }

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        limit_except GET HEAD {
            deny all;
        }

        try_files $uri =404;
    }
}
