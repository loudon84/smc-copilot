services:
  release-server:
    image: nginx:1.26.3-alpine
    container_name: smc-release-server
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ${RELEASE_DATA_ROOT:-/data/smc-release}:/srv/releases:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://127.0.0.1/healthz | grep -q OK"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
