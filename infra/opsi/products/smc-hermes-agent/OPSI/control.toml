[Package]
version = "1"
depends = []

[Product]
type = "localboot"
id = "smc-hermes-agent"
name = "SMC Hermes Agent"
description = "OPSI localboot adapter for Hermes install, update, config, health, diagnostics"
advice = "Do not install Hermes into systemprofile. Machine layer stages; user context starts Gateway."

version = "1.7.2"

priority = 0
licenseRequired = false
productClasses = []

setupScript = "setup.opsiscript"
uninstallScript = "uninstall.opsiscript"
updateScript = "update.opsiscript"
alwaysScript = ""
onceScript = ""
customScript = "custom.opsiscript"
userLoginScript = ""

windowsSoftwareIds = []

[[ProductProperty]]
type = "bool"
name = "gateway_autostart"
description = "Start Hermes Gateway at user logon"
default = [true]

[[ProductProperty]]
type = "bool"
name = "diagnostics_enabled"
description = "Allow diagnostic bundle collection"
default = [true]

[[ProductProperty]]
type = "unicode"
name = "hermes_version"
multivalue = false
editable = true
description = "Exact Hermes version. latest is forbidden."
values = []
default = ["0.22.0"]

[[ProductProperty]]
type = "unicode"
name = "release_channel"
multivalue = false
editable = false
description = "testing or stable; server must resolve to exact hermes_version before publish"
values = ["testing", "stable"]
default = ["stable"]

[[ProductProperty]]
type = "unicode"
name = "gateway_port"
multivalue = false
editable = true
description = "Gateway listen port"
values = ["8642"]
default = ["8642"]

[[ProductProperty]]
type = "unicode"
name = "managed_profile"
multivalue = false
editable = true
description = "Hermes profile name"
default = ["default"]

[[ProductProperty]]
type = "unicode"
name = "config_revision"
multivalue = false
editable = true
description = "Managed config revision (integer as string)"
default = ["0"]

[[ProductProperty]]
type = "unicode"
name = "diagnostic_log_lines"
multivalue = false
editable = true
description = "Max log lines per category (cap 500)"
default = ["500"]

[[ProductProperty]]
type = "unicode"
name = "auto_repair_level"
multivalue = false
editable = true
description = "0 observe, 1 restart, 2 config/doctor. 3+ requires explicit policy."
values = ["0", "1", "2"]
default = ["1"]

[[ProductProperty]]
type = "unicode"
name = "custom_operation"
multivalue = false
editable = true
description = "Allowlisted custom action. Client-specific only."
values = ["status", "collect-log", "apply-config", "restart-gateway", "diagnose", "repair", "reconcile-controller"]
default = ["status"]

[[ProductProperty]]
type = "unicode"
name = "request_id"
multivalue = false
editable = true
description = "SMC request id (req_*). Client-specific only. Never a product default in production."
default = [""]

[[ProductProperty]]
type = "unicode"
name = "client_id"
multivalue = false
editable = true
description = "OPSI client FQDN. Never COMPUTERNAME."
default = [""]

[[ProductProperty]]
type = "unicode"
name = "managed_user_sid"
multivalue = false
editable = true
description = "Bound user SID (S-1-...). Required for setup/update."
default = [""]

[[ProductProperty]]
type = "unicode"
name = "managed_user_account"
multivalue = false
editable = true
description = "Bound user account DOMAIN\\user. Required for setup/update."
default = [""]

[[ProductProperty]]
type = "unicode"
name = "config_digest"
multivalue = false
editable = true
description = "SHA256 of canonical managed config payload"
default = [""]

[[ProductProperty]]
type = "unicode"
name = "config_payload"
multivalue = false
editable = true
description = "Bounded base64url canonical managed-config payload. Client-specific only."
default = [""]

[[ProductProperty]]
type = "unicode"
name = "controller_revision"
multivalue = false
editable = true
description = "Installed Endpoint Controller revision. Independent of hermes_version."
default = ["2"]
