schema: smc.client-release.config.v2
release:
  version: "1.7.2"
  channel: lab
work:
  enabled: true
clientRuntime:
  platform: windows
  architecture: amd64
  python:
    version: "3.12"
    range: ">=3.12,<3.13"
  node:
    version: "24.21.0"
    range: ">=24.11,<25"
hermes:
  distribution: enterprise-native
  source:
    installUrl: https://github.com/loudon84/copilot-hermes.git
    repositoryHttp: https://github.com/loudon84/copilot-hermes.git
    allowedHosts:
      - github.com
    defaultBranch: main
    approvedCommit: "ae17b582a9679a926aaa3be2eaf209ed1bd540f8"
    publicUpstreamAllowedOnEndpoint: false
  update:
    policy: follow-defaultBranch
  compatibility:
    minVersion: "0.21.0"
    testedVersion: "0.21.0"
  gateway:
    host: "127.0.0.1"
    port: 8642
  policy:
    version: "smc-managed-2"
  bootstrap:
    authMode: anonymous-internal
