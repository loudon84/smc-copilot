schema: smc.client-release.config.v1

release:
  version: "1.7.2"
  channel: "lab"

clientRuntime:
  platform: windows
  architecture: amd64

  python:
    version: "3.12"
    range: ">=3.12,<3.13"

  node:
    version: "22"
    range: ">=22,<23"

work:
  enabled: true

hermes:
  repo: "D:/git/hermes-agent"
  version: auto
  profile: smc-managed

opsi:
  productVersion: "1.7.2"
  packageVersion: "1"
  controllerRevision: "2"
  buildMode: native

external:
  opsiClientInstaller: "D:/packages/opsi-client-agent-installer.exe"
