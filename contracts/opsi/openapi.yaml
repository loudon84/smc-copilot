components:
  schemas:
    AbortRequest:
      additionalProperties: false
      properties:
        actor:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
        changeTicket:
          maxLength: 64
          minLength: 3
          title: Changeticket
          type: string
        reason:
          maxLength: 256
          minLength: 3
          title: Reason
          type: string
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
        rollbackMutated:
          default: false
          title: Rollbackmutated
          type: boolean
      required:
      - reason
      - changeTicket
      title: AbortRequest
      type: object
    ActionCreateRequest:
      additionalProperties: false
      properties:
        autoRepairLevel:
          anyOf:
          - maximum: 4.0
            minimum: 0.0
            type: integer
          - type: 'null'
          title: Autorepairlevel
        configRevision:
          anyOf:
          - maximum: 1000000.0
            minimum: 0.0
            type: integer
          - type: 'null'
          title: Configrevision
        hermesVersion:
          anyOf:
          - maxLength: 64
            type: string
          - type: 'null'
          title: Hermesversion
        note:
          anyOf:
          - maxLength: 256
            type: string
          - type: 'null'
          title: Note
        operation:
          $ref: '#/components/schemas/Operation'
        requestId:
          maxLength: 80
          minLength: 12
          pattern: ^req_[A-Za-z0-9_-]{8,64}$
          title: Requestid
          type: string
        schema:
          const: smc.opsi.action-request.v1
          default: smc.opsi.action-request.v1
          title: Schema
          type: string
        targets:
          items:
            $ref: '#/components/schemas/TargetRef'
          maxItems: 200
          minItems: 1
          title: Targets
          type: array
      required:
      - requestId
      - operation
      - targets
      title: ActionCreateRequest
      type: object
    ApprovalKind:
      enum:
      - start
      - next_batch
      - resume
      - rollback_expand
      - promote
      title: ApprovalKind
      type: string
    ApproveRequest:
      additionalProperties: false
      properties:
        actor:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
        changeTicket:
          maxLength: 64
          minLength: 3
          title: Changeticket
          type: string
        kind:
          $ref: '#/components/schemas/ApprovalKind'
          default: start
        reason:
          maxLength: 256
          minLength: 3
          title: Reason
          type: string
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
      required:
      - reason
      - changeTicket
      title: ApproveRequest
      type: object
    ArtifactChannel:
      enum:
      - testing
      - pilot
      - stable
      - quarantined
      title: ArtifactChannel
      type: string
    ArtifactPromoteRequest:
      additionalProperties: false
      properties:
        actor:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
        changeTicket:
          maxLength: 64
          minLength: 3
          title: Changeticket
          type: string
        digest:
          pattern: ^[a-fA-F0-9]{64}$
          title: Digest
          type: string
        evidenceRef:
          maxLength: 256
          minLength: 3
          title: Evidenceref
          type: string
        fromChannel:
          $ref: '#/components/schemas/ArtifactChannel'
          default: testing
        productVersion:
          title: Productversion
          type: string
        reason:
          maxLength: 256
          minLength: 3
          title: Reason
          type: string
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
        schema:
          const: smc.opsi.artifact-promotion.v1
          default: smc.opsi.artifact-promotion.v1
          title: Schema
          type: string
        signerKeyId:
          title: Signerkeyid
          type: string
        toChannel:
          $ref: '#/components/schemas/ArtifactChannel'
          default: pilot
      required:
      - reason
      - changeTicket
      - productVersion
      - digest
      - signerKeyId
      - evidenceRef
      title: ArtifactPromoteRequest
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    Operation:
      enum:
      - setup
      - update
      - uninstall
      - status
      - collect-log
      - apply-config
      - restart-gateway
      - diagnose
      - repair
      title: Operation
      type: string
    PauseRequest:
      additionalProperties: false
      properties:
        actor:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
        cause:
          maxLength: 64
          minLength: 3
          title: Cause
          type: string
        changeTicket:
          maxLength: 64
          minLength: 3
          title: Changeticket
          type: string
        reason:
          maxLength: 256
          minLength: 3
          title: Reason
          type: string
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
      required:
      - reason
      - changeTicket
      - cause
      title: PauseRequest
      type: object
    PolicyApplyRequest:
      additionalProperties: false
      properties:
        clientIds:
          items:
            type: string
          maxItems: 200
          minItems: 1
          title: Clientids
          type: array
        keys:
          additionalProperties:
            anyOf:
            - type: integer
            - type: string
            - type: boolean
          title: Keys
          type: object
        revision:
          maximum: 1000000.0
          minimum: 1.0
          title: Revision
          type: integer
        schema:
          const: smc.opsi.managed-config.v1
          default: smc.opsi.managed-config.v1
          title: Schema
          type: string
      required:
      - revision
      - clientIds
      - keys
      title: PolicyApplyRequest
      type: object
    PreflightRequest:
      additionalProperties: false
      properties:
        actor:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
        changeTicket:
          maxLength: 64
          minLength: 3
          title: Changeticket
          type: string
        reason:
          maxLength: 256
          minLength: 3
          title: Reason
          type: string
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
      required:
      - reason
      - changeTicket
      title: PreflightRequest
      type: object
    ResumeRequest:
      additionalProperties: false
      properties:
        actor:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
        changeTicket:
          maxLength: 64
          minLength: 3
          title: Changeticket
          type: string
        reason:
          maxLength: 256
          minLength: 3
          title: Reason
          type: string
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
      required:
      - reason
      - changeTicket
      title: ResumeRequest
      type: object
    RollbackRequest:
      additionalProperties: false
      properties:
        actor:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
        batchIndex:
          anyOf:
          - maximum: 20.0
            minimum: 0.0
            type: integer
          - type: 'null'
          title: Batchindex
        changeTicket:
          maxLength: 64
          minLength: 3
          title: Changeticket
          type: string
        clientId:
          anyOf:
          - type: string
          - type: 'null'
          title: Clientid
        reason:
          maxLength: 256
          minLength: 3
          title: Reason
          type: string
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
        scope:
          $ref: '#/components/schemas/RollbackScope'
      required:
      - reason
      - changeTicket
      - scope
      title: RollbackRequest
      type: object
    RollbackScope:
      enum:
      - target
      - batch
      - campaign
      title: RollbackScope
      type: string
    RolloutCreateRequest:
      additionalProperties: false
      properties:
        actor:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
        artifactDigest:
          pattern: ^[a-fA-F0-9]{64}$
          title: Artifactdigest
          type: string
        campaignId:
          maxLength: 80
          minLength: 12
          pattern: ^cmp_[A-Za-z0-9_-]{8,64}$
          title: Campaignid
          type: string
        changeTicket:
          maxLength: 64
          minLength: 3
          title: Changeticket
          type: string
        clientIds:
          items:
            type: string
          maxItems: 20
          minItems: 2
          title: Clientids
          type: array
        configRevision:
          maximum: 1000000.0
          minimum: 1.0
          title: Configrevision
          type: integer
        evidencePolicyRevision:
          default: 1
          minimum: 1.0
          title: Evidencepolicyrevision
          type: integer
        gatePolicyRevision:
          default: 1
          minimum: 1.0
          title: Gatepolicyrevision
          type: integer
        name:
          maxLength: 128
          minLength: 3
          title: Name
          type: string
        packageVersion:
          maxLength: 32
          minLength: 1
          title: Packageversion
          type: string
        productId:
          default: smc-hermes-agent
          title: Productid
          type: string
        productVersion:
          maxLength: 64
          minLength: 1
          title: Productversion
          type: string
        reason:
          maxLength: 256
          minLength: 3
          title: Reason
          type: string
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
        schema:
          const: smc.opsi.rollout-campaign.v1
          default: smc.opsi.rollout-campaign.v1
          title: Schema
          type: string
        signerKeyId:
          maxLength: 64
          minLength: 1
          title: Signerkeyid
          type: string
        windowEnd:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Windowend
        windowStart:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Windowstart
      required:
      - reason
      - changeTicket
      - campaignId
      - name
      - clientIds
      - productVersion
      - packageVersion
      - artifactDigest
      - signerKeyId
      - configRevision
      title: RolloutCreateRequest
      type: object
    StartRequest:
      additionalProperties: false
      properties:
        actor:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
        changeTicket:
          maxLength: 64
          minLength: 3
          title: Changeticket
          type: string
        reason:
          maxLength: 256
          minLength: 3
          title: Reason
          type: string
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
      required:
      - reason
      - changeTicket
      title: StartRequest
      type: object
    TargetRef:
      additionalProperties: false
      properties:
        clientId:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Clientid
          type: string
        userBinding:
          anyOf:
          - $ref: '#/components/schemas/UserBinding'
          - type: 'null'
      required:
      - clientId
      title: TargetRef
      type: object
    UserBinding:
      additionalProperties: false
      properties:
        account:
          maxLength: 128
          minLength: 1
          title: Account
          type: string
        sid:
          maxLength: 184
          minLength: 8
          pattern: ^S-1-[0-9-]+$
          title: Sid
          type: string
      required:
      - sid
      - account
      title: UserBinding
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
