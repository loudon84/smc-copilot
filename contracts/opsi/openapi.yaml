components:
  schemas:
    ActionCreateRequest:
      additionalProperties: false
      properties:
        autoRepairLevel:
          anyOf:
          - maximum: 4.0
            minimum: 0.0
            type: integer
          - type: 'null'
          title: Autorepairlevel
        configRevision:
          anyOf:
          - maximum: 1000000.0
            minimum: 0.0
            type: integer
          - type: 'null'
          title: Configrevision
        hermesVersion:
          anyOf:
          - maxLength: 64
            type: string
          - type: 'null'
          title: Hermesversion
        note:
          anyOf:
          - maxLength: 256
            type: string
          - type: 'null'
          title: Note
        operation:
          $ref: '#/components/schemas/Operation'
        requestId:
          maxLength: 80
          minLength: 12
          pattern: ^req_[A-Za-z0-9_-]{8,64}$
          title: Requestid
          type: string
        schema:
          const: smc.opsi.action-request.v1
          default: smc.opsi.action-request.v1
          title: Schema
          type: string
        targets:
          items:
            $ref: '#/components/schemas/TargetRef'
          maxItems: 200
          minItems: 1
          title: Targets
          type: array
      required:
      - requestId
      - operation
      - targets
      title: ActionCreateRequest
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    Operation:
      enum:
      - setup
      - update
      - uninstall
      - status
      - collect-log
      - apply-config
      - restart-gateway
      - diagnose
      - repair
      title: Operation
      type: string
    PolicyApplyRequest:
      additionalProperties: false
      properties:
        clientIds:
          items:
            type: string
          maxItems: 200
          minItems: 1
          title: Clientids
          type: array
        keys:
          additionalProperties:
            anyOf:
            - type: integer
            - type: string
            - type: boolean
          title: Keys
          type: object
        revision:
          maximum: 1000000.0
          minimum: 1.0
          title: Revision
          type: integer
        schema:
          const: smc.opsi.managed-config.v1
          default: smc.opsi.managed-config.v1
          title: Schema
          type: string
      required:
      - revision
      - clientIds
      - keys
      title: PolicyApplyRequest
      type: object
    TargetRef:
      additionalProperties: false
      properties:
        clientId:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Clientid
          type: string
      required:
      - clientId
      title: TargetRef
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
