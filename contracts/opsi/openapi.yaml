components:
  schemas:
    AbortRequest:
      additionalProperties: false
      properties:
        actor:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
        changeTicket:
          maxLength: 64
          minLength: 3
          title: Changeticket
          type: string
        reason:
          maxLength: 256
          minLength: 3
          title: Reason
          type: string
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
        rollbackMutated:
          default: false
          title: Rollbackmutated
          type: boolean
      required:
      - reason
      - changeTicket
      title: AbortRequest
      type: object
    ActionCreateRequest:
      additionalProperties: false
      properties:
        autoRepairLevel:
          anyOf:
          - maximum: 4.0
            minimum: 0.0
            type: integer
          - type: 'null'
          title: Autorepairlevel
        configRevision:
          anyOf:
          - maximum: 1000000.0
            minimum: 0.0
            type: integer
          - type: 'null'
          title: Configrevision
        hermesVersion:
          anyOf:
          - maxLength: 64
            type: string
          - type: 'null'
          title: Hermesversion
        note:
          anyOf:
          - maxLength: 256
            type: string
          - type: 'null'
          title: Note
        operation:
          $ref: '#/components/schemas/Operation'
        parentRequestId:
          anyOf:
          - pattern: ^req_[A-Za-z0-9_-]{8,64}$
            type: string
          - type: 'null'
          title: Parentrequestid
        requestId:
          maxLength: 80
          minLength: 12
          pattern: ^req_[A-Za-z0-9_-]{8,64}$
          title: Requestid
          type: string
        resultKind:
          anyOf:
          - maxLength: 32
            type: string
          - type: 'null'
          title: Resultkind
        schema:
          const: smc.opsi.action-request.v1
          default: smc.opsi.action-request.v1
          title: Schema
          type: string
        targets:
          items:
            $ref: '#/components/schemas/TargetRef'
          maxItems: 200
          minItems: 1
          title: Targets
          type: array
      required:
      - requestId
      - operation
      - targets
      title: ActionCreateRequest
      type: object
    ActionStatus:
      enum:
      - CREATED
      - QUEUED
      - DISPATCHED
      - RUNNING
      - SUCCEEDED
      - FAILED
      - CANCELLED
      - UNKNOWN
      - WAITING_CLIENT
      title: ActionStatus
      type: string
    ActionTargetView:
      additionalProperties: false
      properties:
        attempt:
          anyOf:
          - type: integer
          - type: 'null'
          title: Attempt
        clientId:
          title: Clientid
          type: string
        errorCode:
          anyOf:
          - type: string
          - type: 'null'
          title: Errorcode
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
        status:
          $ref: '#/components/schemas/ActionStatus'
        userBinding:
          anyOf:
          - $ref: '#/components/schemas/UserBinding'
          - type: 'null'
      required:
      - clientId
      - status
      title: ActionTargetView
      type: object
    ActionView:
      additionalProperties: false
      properties:
        createdAt:
          format: date-time
          title: Createdat
          type: string
        operation:
          $ref: '#/components/schemas/Operation'
        payloadDigest:
          title: Payloaddigest
          type: string
        requestId:
          title: Requestid
          type: string
        status:
          $ref: '#/components/schemas/ActionStatus'
        targets:
          items:
            $ref: '#/components/schemas/ActionTargetView'
          title: Targets
          type: array
        updatedAt:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Updatedat
      required:
      - requestId
      - operation
      - status
      - payloadDigest
      - targets
      - createdAt
      title: ActionView
      type: object
    ApprovalKind:
      enum:
      - start
      - next_batch
      - next_ring
      - resume
      - rollback_expand
      - promote
      - freeze_clear
      - depot_resume
      title: ApprovalKind
      type: string
    ApproveRequest:
      additionalProperties: false
      properties:
        actor:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
        changeTicket:
          maxLength: 64
          minLength: 3
          title: Changeticket
          type: string
        kind:
          $ref: '#/components/schemas/ApprovalKind'
          default: start
        reason:
          maxLength: 256
          minLength: 3
          title: Reason
          type: string
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
      required:
      - reason
      - changeTicket
      title: ApproveRequest
      type: object
    ArtifactChannel:
      enum:
      - testing
      - pilot
      - stable
      - quarantined
      title: ArtifactChannel
      type: string
    ArtifactPromoteRequest:
      additionalProperties: false
      properties:
        actor:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
        changeTicket:
          maxLength: 64
          minLength: 3
          title: Changeticket
          type: string
        digest:
          pattern: ^[a-fA-F0-9]{64}$
          title: Digest
          type: string
        evidenceRef:
          maxLength: 256
          minLength: 3
          title: Evidenceref
          type: string
        fromChannel:
          $ref: '#/components/schemas/ArtifactChannel'
          default: testing
        productVersion:
          title: Productversion
          type: string
        reason:
          maxLength: 256
          minLength: 3
          title: Reason
          type: string
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
        schema:
          const: smc.opsi.artifact-promotion.v1
          default: smc.opsi.artifact-promotion.v1
          title: Schema
          type: string
        signerKeyId:
          title: Signerkeyid
          type: string
        toChannel:
          $ref: '#/components/schemas/ArtifactChannel'
          default: pilot
      required:
      - reason
      - changeTicket
      - productVersion
      - digest
      - signerKeyId
      - evidenceRef
      title: ArtifactPromoteRequest
      type: object
    BindingUpsertRequest:
      additionalProperties: false
      properties:
        actor:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
        changeTicket:
          maxLength: 64
          minLength: 3
          title: Changeticket
          type: string
        evidenceRef:
          maxLength: 256
          minLength: 3
          title: Evidenceref
          type: string
        reason:
          maxLength: 256
          minLength: 3
          title: Reason
          type: string
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
        userAccount:
          maxLength: 128
          minLength: 1
          title: Useraccount
          type: string
        userSid:
          maxLength: 184
          minLength: 8
          pattern: ^S-1-[0-9-]+$
          title: Usersid
          type: string
      required:
      - userSid
      - userAccount
      - evidenceRef
      - reason
      - changeTicket
      title: BindingUpsertRequest
      type: object
    CampaignMode:
      enum:
      - pilot
      - production
      title: CampaignMode
      type: string
    ControllerEvidenceUpsertRequest:
      additionalProperties: false
      properties:
        actor:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
        controllerDigest:
          default: ''
          maxLength: 64
          title: Controllerdigest
          type: string
        controllerRevision:
          default: ''
          maxLength: 64
          title: Controllerrevision
          type: string
        gatewayReachable:
          default: false
          title: Gatewayreachable
          type: boolean
        health:
          $ref: '#/components/schemas/HealthStatus'
          default: UNKNOWN
        observedAt:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Observedat
        owner:
          default: ''
          maxLength: 32
          title: Owner
          type: string
        releaseIndexDigest:
          default: ''
          maxLength: 64
          title: Releaseindexdigest
          type: string
        runtimeDigest:
          default: ''
          maxLength: 64
          title: Runtimedigest
          type: string
        runtimeVersion:
          default: ''
          maxLength: 64
          title: Runtimeversion
          type: string
        schema:
          const: smc.opsi.endpoint-controller-state.v2
          default: smc.opsi.endpoint-controller-state.v2
          title: Schema
          type: string
        transactionPhase:
          default: ''
          maxLength: 64
          title: Transactionphase
          type: string
      title: ControllerEvidenceUpsertRequest
      type: object
    DepotAttestationRequest:
      additionalProperties: false
      properties:
        actor:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
        algorithm:
          default: Ed25519
          title: Algorithm
          type: string
        artifactDigest:
          pattern: ^[a-fA-F0-9]{64}$
          title: Artifactdigest
          type: string
        changeTicket:
          maxLength: 64
          minLength: 3
          title: Changeticket
          type: string
        depotId:
          maxLength: 128
          minLength: 3
          title: Depotid
          type: string
        envelopeDigest:
          default: ''
          pattern: ^$|^[a-fA-F0-9]{64}$
          title: Envelopedigest
          type: string
        evidenceRef:
          maxLength: 256
          minLength: 3
          title: Evidenceref
          type: string
        expiresAt:
          format: date-time
          title: Expiresat
          type: string
        generatedAt:
          format: date-time
          title: Generatedat
          type: string
        issuer:
          maxLength: 64
          minLength: 3
          title: Issuer
          type: string
        keyId:
          default: ''
          title: Keyid
          type: string
        packageVersion:
          title: Packageversion
          type: string
        productId:
          default: smc-hermes-agent
          title: Productid
          type: string
        productVersion:
          title: Productversion
          type: string
        readbackDigest:
          default: ''
          pattern: ^$|^[a-fA-F0-9]{64}$
          title: Readbackdigest
          type: string
        readbackObservedAt:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Readbackobservedat
        reason:
          maxLength: 256
          minLength: 3
          title: Reason
          type: string
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
        signature:
          maxLength: 4096
          minLength: 32
          title: Signature
          type: string
        signerKeyId:
          default: ''
          title: Signerkeyid
          type: string
      required:
      - reason
      - changeTicket
      - depotId
      - productVersion
      - packageVersion
      - artifactDigest
      - issuer
      - generatedAt
      - expiresAt
      - signature
      - evidenceRef
      title: DepotAttestationRequest
      type: object
    DepotPauseRequest:
      additionalProperties: false
      properties:
        actor:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
        cause:
          maxLength: 64
          minLength: 3
          title: Cause
          type: string
        changeTicket:
          maxLength: 64
          minLength: 3
          title: Changeticket
          type: string
        reason:
          maxLength: 256
          minLength: 3
          title: Reason
          type: string
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
      required:
      - reason
      - changeTicket
      - cause
      title: DepotPauseRequest
      type: object
    DispatchMode:
      enum:
      - v1
      - v2
      title: DispatchMode
      type: string
    FreezeClearRequest:
      additionalProperties: false
      properties:
        actor:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
        changeTicket:
          maxLength: 64
          minLength: 3
          title: Changeticket
          type: string
        reason:
          maxLength: 256
          minLength: 3
          title: Reason
          type: string
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
        rootCauseClosed:
          default: true
          title: Rootcauseclosed
          type: boolean
      required:
      - reason
      - changeTicket
      title: FreezeClearRequest
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    HealthStatus:
      enum:
      - HEALTHY
      - WARNING
      - CRITICAL
      - OFFLINE
      - UNKNOWN
      title: HealthStatus
      type: string
    InventoryEvidenceUpsertRequest:
      additionalProperties: false
      properties:
        actor:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
        bootstrapTask:
          default: ''
          maxLength: 160
          title: Bootstraptask
          type: string
        cliPath:
          default: ''
          maxLength: 256
          title: Clipath
          type: string
        cliVersion:
          default: ''
          maxLength: 64
          title: Cliversion
          type: string
        diskFreeMb:
          maximum: 10000000.0
          minimum: 0.0
          title: Diskfreemb
          type: integer
        gatewayHealthy:
          default: false
          title: Gatewayhealthy
          type: boolean
        gatewayTask:
          default: ''
          maxLength: 160
          title: Gatewaytask
          type: string
        lastSeenMinutes:
          maximum: 10080.0
          minimum: 0.0
          title: Lastseenminutes
          type: integer
        os:
          maxLength: 64
          minLength: 1
          title: Os
          type: string
        owner:
          default: ''
          maxLength: 32
          title: Owner
          type: string
        previousDigest:
          default: ''
          maxLength: 64
          title: Previousdigest
          type: string
        previousVersion:
          default: ''
          maxLength: 64
          title: Previousversion
          type: string
      required:
      - os
      - lastSeenMinutes
      - diskFreeMb
      title: InventoryEvidenceUpsertRequest
      type: object
    LiveGateApproval:
      additionalProperties: false
      properties:
        keyId:
          title: Keyid
          type: string
        role:
          title: Role
          type: string
        signature:
          title: Signature
          type: string
      required:
      - role
      - keyId
      - signature
      title: LiveGateApproval
      type: object
    LiveGateImportRequest:
      additionalProperties: false
      properties:
        approvals:
          items:
            $ref: '#/components/schemas/LiveGateApproval'
          title: Approvals
          type: array
        decision:
          default: NO-GO
          enum:
          - GO
          - NO-GO
          title: Decision
          type: string
        evidenceRef:
          maxLength: 256
          minLength: 3
          title: Evidenceref
          type: string
        expiresAt:
          format: date-time
          title: Expiresat
          type: string
        gateId:
          maxLength: 80
          minLength: 8
          title: Gateid
          type: string
        inputDigest:
          pattern: ^[a-fA-F0-9]{64}$
          title: Inputdigest
          type: string
        payload:
          additionalProperties: true
          title: Payload
          type: object
        schema:
          const: smc.opsi.live-gate.v1
          default: smc.opsi.live-gate.v1
          title: Schema
          type: string
      required:
      - gateId
      - evidenceRef
      - expiresAt
      - inputDigest
      - payload
      - approvals
      title: LiveGateImportRequest
      type: object
    LiveGateRevokeRequest:
      additionalProperties: false
      properties:
        changeTicket:
          maxLength: 64
          minLength: 3
          title: Changeticket
          type: string
        reason:
          maxLength: 256
          minLength: 3
          title: Reason
          type: string
      required:
      - reason
      - changeTicket
      title: LiveGateRevokeRequest
      type: object
    Operation:
      enum:
      - setup
      - update
      - uninstall
      - status
      - collect-log
      - apply-config
      - restart-gateway
      - diagnose
      - repair
      - reconcile-controller
      - version
      - v2-command
      title: Operation
      type: string
    PauseRequest:
      additionalProperties: false
      properties:
        actor:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
        cause:
          maxLength: 64
          minLength: 3
          title: Cause
          type: string
        changeTicket:
          maxLength: 64
          minLength: 3
          title: Changeticket
          type: string
        reason:
          maxLength: 256
          minLength: 3
          title: Reason
          type: string
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
      required:
      - reason
      - changeTicket
      - cause
      title: PauseRequest
      type: object
    PolicyApplyRequest:
      additionalProperties: false
      properties:
        clientIds:
          items:
            type: string
          maxItems: 200
          minItems: 1
          title: Clientids
          type: array
        keys:
          additionalProperties:
            anyOf:
            - type: integer
            - type: string
            - type: boolean
          title: Keys
          type: object
        revision:
          maximum: 1000000.0
          minimum: 1.0
          title: Revision
          type: integer
        schema:
          const: smc.opsi.managed-config.v1
          default: smc.opsi.managed-config.v1
          title: Schema
          type: string
      required:
      - revision
      - clientIds
      - keys
      title: PolicyApplyRequest
      type: object
    PreflightRequest:
      additionalProperties: false
      properties:
        actor:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
        changeTicket:
          maxLength: 64
          minLength: 3
          title: Changeticket
          type: string
        reason:
          maxLength: 256
          minLength: 3
          title: Reason
          type: string
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
      required:
      - reason
      - changeTicket
      title: PreflightRequest
      type: object
    ProductReleaseUpsertRequest:
      additionalProperties: false
      properties:
        attestationDigest:
          default: ''
          maxLength: 64
          title: Attestationdigest
          type: string
        buildId:
          default: build-local
          maxLength: 80
          minLength: 1
          title: Buildid
          type: string
        canonicalDigest:
          default: ''
          maxLength: 64
          title: Canonicaldigest
          type: string
        controller:
          additionalProperties: true
          title: Controller
          type: object
        createdAt:
          default: ''
          title: Createdat
          type: string
        depotReadback:
          additionalProperties: true
          title: Depotreadback
          type: object
        liveEligible:
          default: false
          title: Liveeligible
          type: boolean
        packageVersion:
          maxLength: 16
          minLength: 1
          title: Packageversion
          type: string
        productId:
          default: smc-hermes-agent
          title: Productid
          type: string
        productVersion:
          maxLength: 32
          minLength: 1
          title: Productversion
          type: string
        runtimes:
          items:
            additionalProperties: true
            type: object
          title: Runtimes
          type: array
        schema:
          const: smc.opsi.product-release.v1
          default: smc.opsi.product-release.v1
          title: Schema
          type: string
        signature:
          default: ''
          minLength: 0
          title: Signature
          type: string
        signerKeyId:
          default: ''
          maxLength: 64
          title: Signerkeyid
          type: string
        sourceRevision:
          default: unknownrev
          maxLength: 64
          minLength: 7
          title: Sourcerevision
          type: string
        verified:
          default: false
          title: Verified
          type: boolean
        verifier:
          additionalProperties: true
          title: Verifier
          type: object
      required:
      - productVersion
      - packageVersion
      title: ProductReleaseUpsertRequest
      type: object
    ReleaseFreezeRequest:
      additionalProperties: false
      properties:
        actor:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
        cause:
          maxLength: 64
          minLength: 3
          title: Cause
          type: string
        changeTicket:
          maxLength: 64
          minLength: 3
          title: Changeticket
          type: string
        freezeId:
          maxLength: 80
          minLength: 8
          pattern: ^frz_[A-Za-z0-9_-]{4,64}$
          title: Freezeid
          type: string
        reason:
          maxLength: 256
          minLength: 3
          title: Reason
          type: string
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
      required:
      - reason
      - changeTicket
      - freezeId
      - cause
      title: ReleaseFreezeRequest
      type: object
    ResumeRequest:
      additionalProperties: false
      properties:
        actor:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
        changeTicket:
          maxLength: 64
          minLength: 3
          title: Changeticket
          type: string
        reason:
          maxLength: 256
          minLength: 3
          title: Reason
          type: string
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
      required:
      - reason
      - changeTicket
      title: ResumeRequest
      type: object
    RollbackRequest:
      additionalProperties: false
      properties:
        actor:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
        batchIndex:
          anyOf:
          - maximum: 500.0
            minimum: 0.0
            type: integer
          - type: 'null'
          title: Batchindex
        changeTicket:
          maxLength: 64
          minLength: 3
          title: Changeticket
          type: string
        clientId:
          anyOf:
          - type: string
          - type: 'null'
          title: Clientid
        depotId:
          anyOf:
          - type: string
          - type: 'null'
          title: Depotid
        reason:
          maxLength: 256
          minLength: 3
          title: Reason
          type: string
        ringIndex:
          anyOf:
          - maximum: 4.0
            minimum: 0.0
            type: integer
          - type: 'null'
          title: Ringindex
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
        scope:
          $ref: '#/components/schemas/RollbackScope'
      required:
      - reason
      - changeTicket
      - scope
      title: RollbackRequest
      type: object
    RollbackScope:
      enum:
      - target
      - batch
      - depot
      - ring
      - campaign
      title: RollbackScope
      type: string
    RolloutCreateRequest:
      additionalProperties: false
      properties:
        actor:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
        artifactDigest:
          pattern: ^[a-fA-F0-9]{64}$
          title: Artifactdigest
          type: string
        campaignId:
          maxLength: 80
          minLength: 12
          pattern: ^cmp_[A-Za-z0-9_-]{8,64}$
          title: Campaignid
          type: string
        changeTicket:
          maxLength: 64
          minLength: 3
          title: Changeticket
          type: string
        clientIds:
          items:
            type: string
          maxItems: 500
          minItems: 2
          title: Clientids
          type: array
        configRevision:
          maximum: 1000000.0
          minimum: 1.0
          title: Configrevision
          type: integer
        dispatchMode:
          $ref: '#/components/schemas/DispatchMode'
          default: v1
        evidencePolicyRevision:
          default: 1
          minimum: 1.0
          title: Evidencepolicyrevision
          type: integer
        gatePolicyRevision:
          default: 1
          minimum: 1.0
          title: Gatepolicyrevision
          type: integer
        mode:
          $ref: '#/components/schemas/CampaignMode'
          default: pilot
        name:
          maxLength: 128
          minLength: 3
          title: Name
          type: string
        packageVersion:
          maxLength: 32
          minLength: 1
          title: Packageversion
          type: string
        pilotPolicyRevision:
          default: accelerated-v1.4
          title: Pilotpolicyrevision
          type: string
        productId:
          default: smc-hermes-agent
          title: Productid
          type: string
        productVersion:
          maxLength: 64
          minLength: 1
          title: Productversion
          type: string
        productionPolicyRevision:
          default: controlled-reentry-v1.5
          title: Productionpolicyrevision
          type: string
        reason:
          maxLength: 256
          minLength: 3
          title: Reason
