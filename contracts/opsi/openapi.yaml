components:
  schemas:
    AbortRequest:
      additionalProperties: false
      properties:
        actor:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
        changeTicket:
          maxLength: 64
          minLength: 3
          title: Changeticket
          type: string
        reason:
          maxLength: 256
          minLength: 3
          title: Reason
          type: string
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
        rollbackMutated:
          default: false
          title: Rollbackmutated
          type: boolean
      required:
      - reason
      - changeTicket
      title: AbortRequest
      type: object
    ActionCreateRequest:
      additionalProperties: false
      properties:
        autoRepairLevel:
          anyOf:
          - maximum: 4.0
            minimum: 0.0
            type: integer
          - type: 'null'
          title: Autorepairlevel
        configRevision:
          anyOf:
          - maximum: 1000000.0
            minimum: 0.0
            type: integer
          - type: 'null'
          title: Configrevision
        hermesVersion:
          anyOf:
          - maxLength: 64
            type: string
          - type: 'null'
          title: Hermesversion
        note:
          anyOf:
          - maxLength: 256
            type: string
          - type: 'null'
          title: Note
        operation:
          $ref: '#/components/schemas/Operation'
        parentRequestId:
          anyOf:
          - pattern: ^req_[A-Za-z0-9_-]{8,64}$
            type: string
          - type: 'null'
          title: Parentrequestid
        requestId:
          maxLength: 80
          minLength: 12
          pattern: ^req_[A-Za-z0-9_-]{8,64}$
          title: Requestid
          type: string
        resultKind:
          anyOf:
          - maxLength: 32
            type: string
          - type: 'null'
          title: Resultkind
        schema:
          const: smc.opsi.action-request.v1
          default: smc.opsi.action-request.v1
          title: Schema
          type: string
        targets:
          items:
            $ref: '#/components/schemas/TargetRef'
          maxItems: 200
          minItems: 1
          title: Targets
          type: array
      required:
      - requestId
      - operation
      - targets
      title: ActionCreateRequest
      type: object
    ApprovalKind:
      enum:
      - start
      - next_batch
      - next_ring
      - resume
      - rollback_expand
      - promote
      - freeze_clear
      - depot_resume
      title: ApprovalKind
      type: string
    ApproveRequest:
      additionalProperties: false
      properties:
        actor:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
        changeTicket:
          maxLength: 64
          minLength: 3
          title: Changeticket
          type: string
        kind:
          $ref: '#/components/schemas/ApprovalKind'
          default: start
        reason:
          maxLength: 256
          minLength: 3
          title: Reason
          type: string
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
      required:
      - reason
      - changeTicket
      title: ApproveRequest
      type: object
    ArtifactChannel:
      enum:
      - testing
      - pilot
      - stable
      - quarantined
      title: ArtifactChannel
      type: string
    ArtifactPromoteRequest:
      additionalProperties: false
      properties:
        actor:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
        changeTicket:
          maxLength: 64
          minLength: 3
          title: Changeticket
          type: string
        digest:
          pattern: ^[a-fA-F0-9]{64}$
          title: Digest
          type: string
        evidenceRef:
          maxLength: 256
          minLength: 3
          title: Evidenceref
          type: string
        fromChannel:
          $ref: '#/components/schemas/ArtifactChannel'
          default: testing
        productVersion:
          title: Productversion
          type: string
        reason:
          maxLength: 256
          minLength: 3
          title: Reason
          type: string
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
        schema:
          const: smc.opsi.artifact-promotion.v1
          default: smc.opsi.artifact-promotion.v1
          title: Schema
          type: string
        signerKeyId:
          title: Signerkeyid
          type: string
        toChannel:
          $ref: '#/components/schemas/ArtifactChannel'
          default: pilot
      required:
      - reason
      - changeTicket
      - productVersion
      - digest
      - signerKeyId
      - evidenceRef
      title: ArtifactPromoteRequest
      type: object
    BindingUpsertRequest:
      additionalProperties: false
      properties:
        actor:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
        changeTicket:
          maxLength: 64
          minLength: 3
          title: Changeticket
          type: string
        evidenceRef:
          maxLength: 256
          minLength: 3
          title: Evidenceref
          type: string
        reason:
          maxLength: 256
          minLength: 3
          title: Reason
          type: string
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
        userAccount:
          maxLength: 128
          minLength: 1
          title: Useraccount
          type: string
        userSid:
          maxLength: 184
          minLength: 8
          pattern: ^S-1-[0-9-]+$
          title: Usersid
          type: string
      required:
      - userSid
      - userAccount
      - evidenceRef
      - reason
      - changeTicket
      title: BindingUpsertRequest
      type: object
    CampaignMode:
      enum:
      - pilot
      - production
      title: CampaignMode
      type: string
    DepotAttestationRequest:
      additionalProperties: false
      properties:
        actor:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
        artifactDigest:
          pattern: ^[a-fA-F0-9]{64}$
          title: Artifactdigest
          type: string
        changeTicket:
          maxLength: 64
          minLength: 3
          title: Changeticket
          type: string
        depotId:
          maxLength: 128
          minLength: 3
          title: Depotid
          type: string
        evidenceRef:
          maxLength: 256
          minLength: 3
          title: Evidenceref
          type: string
        expiresAt:
          format: date-time
          title: Expiresat
          type: string
        generatedAt:
          format: date-time
          title: Generatedat
          type: string
        issuer:
          maxLength: 64
          minLength: 3
          title: Issuer
          type: string
        packageVersion:
          title: Packageversion
          type: string
        productId:
          default: smc-hermes-agent
          title: Productid
          type: string
        productVersion:
          title: Productversion
          type: string
        reason:
          maxLength: 256
          minLength: 3
          title: Reason
          type: string
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
        signature:
          maxLength: 4096
          minLength: 32
          title: Signature
          type: string
      required:
      - reason
      - changeTicket
      - depotId
      - productVersion
      - packageVersion
      - artifactDigest
      - issuer
      - generatedAt
      - expiresAt
      - signature
      - evidenceRef
      title: DepotAttestationRequest
      type: object
    DepotPauseRequest:
      additionalProperties: false
      properties:
        actor:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
        cause:
          maxLength: 64
          minLength: 3
          title: Cause
          type: string
        changeTicket:
          maxLength: 64
          minLength: 3
          title: Changeticket
          type: string
        reason:
          maxLength: 256
          minLength: 3
          title: Reason
          type: string
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
      required:
      - reason
      - changeTicket
      - cause
      title: DepotPauseRequest
      type: object
    FreezeClearRequest:
      additionalProperties: false
      properties:
        actor:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
        changeTicket:
          maxLength: 64
          minLength: 3
          title: Changeticket
          type: string
        reason:
          maxLength: 256
          minLength: 3
          title: Reason
          type: string
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
        rootCauseClosed:
          default: true
          title: Rootcauseclosed
          type: boolean
      required:
      - reason
      - changeTicket
      title: FreezeClearRequest
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    InventoryEvidenceUpsertRequest:
      additionalProperties: false
      properties:
        actor:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
        bootstrapTask:
          default: ''
          maxLength: 160
          title: Bootstraptask
          type: string
        cliPath:
          default: ''
          maxLength: 256
          title: Clipath
          type: string
        cliVersion:
          default: ''
          maxLength: 64
          title: Cliversion
          type: string
        diskFreeMb:
          maximum: 10000000.0
          minimum: 0.0
          title: Diskfreemb
          type: integer
        gatewayHealthy:
          default: false
          title: Gatewayhealthy
          type: boolean
        gatewayTask:
          default: ''
          maxLength: 160
          title: Gatewaytask
          type: string
        lastSeenMinutes:
          maximum: 10080.0
          minimum: 0.0
          title: Lastseenminutes
          type: integer
        os:
          maxLength: 64
          minLength: 1
          title: Os
          type: string
        owner:
          default: ''
          maxLength: 32
          title: Owner
          type: string
        previousDigest:
          default: ''
          maxLength: 64
          title: Previousdigest
          type: string
        previousVersion:
          default: ''
          maxLength: 64
          title: Previousversion
          type: string
      required:
      - os
      - lastSeenMinutes
      - diskFreeMb
      title: InventoryEvidenceUpsertRequest
      type: object
    Operation:
      enum:
      - setup
      - update
      - uninstall
      - status
      - collect-log
      - apply-config
      - restart-gateway
      - diagnose
      - repair
      title: Operation
      type: string
    PauseRequest:
      additionalProperties: false
      properties:
        actor:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
        cause:
          maxLength: 64
          minLength: 3
          title: Cause
          type: string
        changeTicket:
          maxLength: 64
          minLength: 3
          title: Changeticket
          type: string
        reason:
          maxLength: 256
          minLength: 3
          title: Reason
          type: string
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
      required:
      - reason
      - changeTicket
      - cause
      title: PauseRequest
      type: object
    PolicyApplyRequest:
      additionalProperties: false
      properties:
        clientIds:
          items:
            type: string
          maxItems: 200
          minItems: 1
          title: Clientids
          type: array
        keys:
          additionalProperties:
            anyOf:
            - type: integer
            - type: string
            - type: boolean
          title: Keys
          type: object
        revision:
          maximum: 1000000.0
          minimum: 1.0
          title: Revision
          type: integer
        schema:
          const: smc.opsi.managed-config.v1
          default: smc.opsi.managed-config.v1
          title: Schema
          type: string
      required:
      - revision
      - clientIds
      - keys
      title: PolicyApplyRequest
      type: object
    PreflightRequest:
      additionalProperties: false
      properties:
        actor:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
        changeTicket:
          maxLength: 64
          minLength: 3
          title: Changeticket
          type: string
        reason:
          maxLength: 256
          minLength: 3
          title: Reason
          type: string
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
      required:
      - reason
      - changeTicket
      title: PreflightRequest
      type: object
    ReleaseFreezeRequest:
      additionalProperties: false
      properties:
        actor:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
        cause:
          maxLength: 64
          minLength: 3
          title: Cause
          type: string
        changeTicket:
          maxLength: 64
          minLength: 3
          title: Changeticket
          type: string
        freezeId:
          maxLength: 80
          minLength: 8
          pattern: ^frz_[A-Za-z0-9_-]{4,64}$
          title: Freezeid
          type: string
        reason:
          maxLength: 256
          minLength: 3
          title: Reason
          type: string
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
      required:
      - reason
      - changeTicket
      - freezeId
      - cause
      title: ReleaseFreezeRequest
      type: object
    ResumeRequest:
      additionalProperties: false
      properties:
        actor:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
        changeTicket:
          maxLength: 64
          minLength: 3
          title: Changeticket
          type: string
        reason:
          maxLength: 256
          minLength: 3
          title: Reason
          type: string
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
      required:
      - reason
      - changeTicket
      title: ResumeRequest
      type: object
    RollbackRequest:
      additionalProperties: false
      properties:
        actor:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
        batchIndex:
          anyOf:
          - maximum: 500.0
            minimum: 0.0
            type: integer
          - type: 'null'
          title: Batchindex
        changeTicket:
          maxLength: 64
          minLength: 3
          title: Changeticket
          type: string
        clientId:
          anyOf:
          - type: string
          - type: 'null'
          title: Clientid
        depotId:
          anyOf:
          - type: string
          - type: 'null'
          title: Depotid
        reason:
          maxLength: 256
          minLength: 3
          title: Reason
          type: string
        ringIndex:
          anyOf:
          - maximum: 4.0
            minimum: 0.0
            type: integer
          - type: 'null'
          title: Ringindex
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
        scope:
          $ref: '#/components/schemas/RollbackScope'
      required:
      - reason
      - changeTicket
      - scope
      title: RollbackRequest
      type: object
    RollbackScope:
      enum:
      - target
      - batch
      - depot
      - ring
      - campaign
      title: RollbackScope
      type: string
    RolloutCreateRequest:
      additionalProperties: false
      properties:
        actor:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
        artifactDigest:
          pattern: ^[a-fA-F0-9]{64}$
          title: Artifactdigest
          type: string
        campaignId:
          maxLength: 80
          minLength: 12
          pattern: ^cmp_[A-Za-z0-9_-]{8,64}$
          title: Campaignid
          type: string
        changeTicket:
          maxLength: 64
          minLength: 3
          title: Changeticket
          type: string
        clientIds:
          items:
            type: string
          maxItems: 500
          minItems: 2
          title: Clientids
          type: array
        configRevision:
          maximum: 1000000.0
          minimum: 1.0
          title: Configrevision
          type: integer
        evidencePolicyRevision:
          default: 1
          minimum: 1.0
          title: Evidencepolicyrevision
          type: integer
        gatePolicyRevision:
          default: 1
          minimum: 1.0
          title: Gatepolicyrevision
          type: integer
        mode:
          $ref: '#/components/schemas/CampaignMode'
          default: pilot
        name:
          maxLength: 128
          minLength: 3
          title: Name
          type: string
        packageVersion:
          maxLength: 32
          minLength: 1
          title: Packageversion
          type: string
        pilotPolicyRevision:
          default: accelerated-v1.4
          title: Pilotpolicyrevision
          type: string
        productId:
          default: smc-hermes-agent
          title: Productid
          type: string
        productVersion:
          maxLength: 64
          minLength: 1
          title: Productversion
          type: string
        reason:
          maxLength: 256
          minLength: 3
          title: Reason
          type: string
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
        schema:
          const: smc.opsi.rollout-campaign.v1
          default: smc.opsi.rollout-campaign.v1
          title: Schema
          type: string
        signerKeyId:
          maxLength: 64
          minLength: 1
          title: Signerkeyid
          type: string
        windowEnd:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Windowend
        windowStart:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Windowstart
      required:
      - reason
      - changeTicket
      - campaignId
      - name
      - clientIds
      - productVersion
      - packageVersion
      - artifactDigest
      - signerKeyId
      - configRevision
      title: RolloutCreateRequest
      type: object
    StartRequest:
      additionalProperties: false
      properties:
        actor:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
        changeTicket:
          maxLength: 64
          minLength: 3
          title: Changeticket
          type: string
        reason:
          maxLength: 256
          minLength: 3
          title: Reason
          type: string
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
      required:
      - reason
      - changeTicket
      title: StartRequest
      type: object
    TargetRef:
      additionalProperties: false
      properties:
        clientId:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Clientid
          type: string
        userBinding:
          anyOf:
          - $ref: '#/components/schemas/UserBinding'
          - type: 'null'
      required:
      - clientId
      title: TargetRef
      type: object
    UserBinding:
      additionalProperties: false
      properties:
        account:
          maxLength: 128
          minLength: 1
          title: Account
          type: string
        sid:
          maxLength: 184
          minLength: 8
          pattern: ^S-1-[0-9-]+$
          title: Sid
          type: string
      required:
      - sid
      - account
      title: UserBinding
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
info:
  title: SMC OPSI Control
  version: 1.4.0
openapi: 3.1.0
paths:
  /api/v1/opsi/actions:
    post:
      operationId: create_action_api_v1_opsi_actions_post
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionCreateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Create Action
      tags:
      - actions
  /api/v1/opsi/actions/{request_id}:
    get:
      operationId: get_action_api_v1_opsi_actions__request_id__get
      parameters:
      - in: path
        name: request_id
        required: true
        schema:
          title: Request Id
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Action
      tags:
      - actions
  /api/v1/opsi/actions/{request_id}/results:
    get:
      operationId: action_results_api_v1_opsi_actions__request_id__results_get
      parameters:
      - in: path
        name: request_id
        required: true
        schema:
          title: Request Id
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Action Results
      tags:
      - actions
  /api/v1/opsi/artifacts/promote:
    post:
      operationId: promote_artifact_api_v1_opsi_artifacts_promote_post
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactPromoteRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Promote Artifact
      tags:
      - rollouts
  /api/v1/opsi/clients:
    get:
      operationId: list_clients_api_v1_opsi_clients_get
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Clients
      tags:
      - clients
  /api/v1/opsi/clients/{client_id}:
    get:
      operationId: get_client_api_v1_opsi_clients__client_id__get
      parameters:
      - in: path
        name: client_id
        required: true
        schema:
          title: Client Id
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Client
      tags:
      - clients
  /api/v1/opsi/clients/{client_id}/binding:
    put:
      operationId: put_binding_api_v1_opsi_clients__client_id__binding_put
      parameters:
      - in: path
        name: client_id
        required: true
        schema:
          title: Client Id
          type: string
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindingUpsertRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
