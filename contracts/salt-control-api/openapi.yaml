components:
  schemas:
    ArtifactMetadataResponse:
      properties:
        arch:
          title: Arch
          type: string
        component:
          title: Component
          type: string
        keyId:
          title: Keyid
          type: string
        manifestSignature:
          title: Manifestsignature
          type: string
        platform:
          title: Platform
          type: string
        rollbackVersion:
          anyOf:
          - type: string
          - type: 'null'
          title: Rollbackversion
        sha256:
          title: Sha256
          type: string
        size:
          title: Size
          type: integer
        url:
          title: Url
          type: string
        version:
          title: Version
          type: string
      required:
      - component
      - version
      - platform
      - arch
      - size
      - sha256
      - url
      - manifestSignature
      - keyId
      title: ArtifactMetadataResponse
      type: object
    ConfigurePayload:
      properties:
        configRevision:
          anyOf:
          - type: string
          - type: 'null'
          title: Configrevision
        desired:
          additionalProperties: true
          title: Desired
          type: object
        kind:
          const: configure
          default: configure
          title: Kind
          type: string
      title: ConfigurePayload
      type: object
    DesiredHermes:
      properties:
        artifactRef:
          title: Artifactref
          type: string
        home:
          title: Home
          type: string
        version:
          title: Version
          type: string
      required:
      - home
      - version
      - artifactRef
      title: DesiredHermes
      type: object
    DesiredRollout:
      properties:
        desiredOwner:
          title: Desiredowner
          type: string
        ring:
          title: Ring
          type: string
      required:
      - ring
      - desiredOwner
      title: DesiredRollout
      type: object
    DesiredSecretRef:
      properties:
        name:
          title: Name
          type: string
        ref:
          title: Ref
          type: string
      required:
      - name
      - ref
      title: DesiredSecretRef
      type: object
    DesiredStateResponse:
      properties:
        endpointId:
          title: Endpointid
          type: string
        hermes:
          anyOf:
          - $ref: '#/components/schemas/DesiredHermes'
          - type: 'null'
        mcp:
          additionalProperties: true
          default: {}
          title: Mcp
          type: object
        notModified:
          default: false
          title: Notmodified
          type: boolean
        profiles:
          default: []
          items: {}
          title: Profiles
          type: array
        revision:
          title: Revision
          type: string
        rollout:
          anyOf:
          - $ref: '#/components/schemas/DesiredRollout'
          - type: 'null'
        schema:
          default: smc.desired-state.v2
          title: Schema
          type: string
        secrets:
          default: []
          items:
            $ref: '#/components/schemas/DesiredSecretRef'
          title: Secrets
          type: array
        user:
          anyOf:
          - $ref: '#/components/schemas/DesiredUser'
          - type: 'null'
      required:
      - endpointId
      - revision
      title: DesiredStateResponse
      type: object
    DesiredUser:
      properties:
        profileDir:
          title: Profiledir
          type: string
        userId:
          title: Userid
          type: string
        windowsAccount:
          title: Windowsaccount
          type: string
        windowsSid:
          title: Windowssid
          type: string
      required:
      - userId
      - windowsAccount
      - windowsSid
      - profileDir
      title: DesiredUser
      type: object
    DeviceInfo:
      properties:
        arch:
          title: Arch
          type: string
        hostname:
          title: Hostname
          type: string
        machineGuidHash:
          title: Machineguidhash
          type: string
        windowsBuild:
          title: Windowsbuild
          type: integer
      required:
      - hostname
      - machineGuidHash
      - windowsBuild
      - arch
      title: DeviceInfo
      type: object
    EndpointStatusResponse:
      properties:
        currentRelease:
          anyOf:
          - type: string
          - type: 'null'
          title: Currentrelease
        currentRevision:
          anyOf:
          - type: string
          - type: 'null'
          title: Currentrevision
        deployment:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Deployment
        desiredRelease:
          anyOf:
          - type: string
          - type: 'null'
          title: Desiredrelease
        desiredRevision:
          anyOf:
          - type: string
          - type: 'null'
          title: Desiredrevision
        endpointId:
          title: Endpointid
          type: string
        gatewayHealth:
          anyOf:
          - type: string
          - type: 'null'
          title: Gatewayhealth
        heartbeat:
          anyOf:
          - type: string
          - type: 'null'
          title: Heartbeat
        lastError:
          anyOf:
          - type: string
          - type: 'null'
          title: Lasterror
        lastJob:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Lastjob
        migrationPhase:
          anyOf:
          - type: string
          - type: 'null'
          title: Migrationphase
        owner:
          anyOf:
          - type: string
          - type: 'null'
          title: Owner
        rollout:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Rollout
        targetState:
          anyOf:
          - type: string
          - type: 'null'
          title: Targetstate
      required:
      - endpointId
      title: EndpointStatusResponse
      type: object
    EnrollmentCreateRequest:
      properties:
        device:
          $ref: '#/components/schemas/DeviceInfo'
        enrollmentToken:
          title: Enrollmenttoken
          type: string
        requestId:
          title: Requestid
          type: string
      required:
      - enrollmentToken
      - requestId
      - device
      title: EnrollmentCreateRequest
      type: object
    EnrollmentCreateResponse:
      properties:
        deviceCredential:
          title: Devicecredential
          type: string
        endpointId:
          title: Endpointid
          type: string
        enrollmentId:
          title: Enrollmentid
          type: string
        expiresAt:
          title: Expiresat
          type: string
        masterFingerprints:
          items:
            type: string
          title: Masterfingerprints
          type: array
        masters:
          items:
            type: string
          title: Masters
          type: array
      required:
      - enrollmentId
      - endpointId
      - masters
      - masterFingerprints
      - deviceCredential
      - expiresAt
      title: EnrollmentCreateResponse
      type: object
    EnrollmentStatusResponse:
      properties:
        endpointId:
          title: Endpointid
          type: string
        enrollmentId:
          title: Enrollmentid
          type: string
        errorCode:
          anyOf:
          - type: string
          - type: 'null'
          title: Errorcode
        masterFingerprints:
          items:
            type: string
          title: Masterfingerprints
          type: array
        masters:
          items:
            type: string
          title: Masters
          type: array
        state:
          title: State
          type: string
      required:
      - enrollmentId
      - endpointId
      - state
      - masters
      - masterFingerprints
      title: EnrollmentStatusResponse
      type: object
    FingerprintReportRequest:
      properties:
        endpointId:
          title: Endpointid
          type: string
        minionFingerprint:
          title: Minionfingerprint
          type: string
        requestId:
          title: Requestid
          type: string
      required:
      - endpointId
      - minionFingerprint
      - requestId
      title: FingerprintReportRequest
      type: object
    FingerprintReportResponse:
      properties:
        endpointId:
          title: Endpointid
          type: string
        enrollmentId:
          title: Enrollmentid
          type: string
        errorCode:
          anyOf:
          - type: string
          - type: 'null'
          title: Errorcode
        state:
          title: State
          type: string
      required:
      - enrollmentId
      - endpointId
      - state
      title: FingerprintReportResponse
      type: object
    GatewayLifecyclePayload:
      properties:
        action:
          default: restart
          enum:
          - start
          - stop
          - restart
          title: Action
          type: string
        kind:
          const: gateway
          default: gateway
          title: Kind
          type: string
      title: GatewayLifecyclePayload
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    HandoverPayload:
      properties:
        configRevision:
          anyOf:
          - type: string
          - type: 'null'
          title: Configrevision
        endpointId:
          anyOf:
          - type: string
          - type: 'null'
          title: Endpointid
        kind:
          const: handover
          default: handover
          title: Kind
          type: string
        releaseId:
          anyOf:
          - type: string
          - type: 'null'
          title: Releaseid
      title: HandoverPayload
      type: object
    InstallPayload:
      properties:
        artifactUrl:
          anyOf:
          - type: string
          - type: 'null'
          title: Artifacturl
        component:
          default: hermes
          title: Component
          type: string
        kind:
          const: install
          default: install
          title: Kind
          type: string
        sha256:
          anyOf:
          - type: string
          - type: 'null'
          title: Sha256
        version:
          anyOf:
          - type: string
          - type: 'null'
          title: Version
      title: InstallPayload
      type: object
    JobCreateRequest:
      properties:
        configRevision:
          anyOf:
          - type: string
          - type: 'null'
          title: Configrevision
        correlationId:
          anyOf:
          - type: string
          - type: 'null'
          title: Correlationid
        endpointId:
          title: Endpointid
          type: string
        idempotencyKey:
          title: Idempotencykey
          type: string
        minionId:
          title: Minionid
          type: string
        operation:
          enum:
          - install
          - configure
          - start
          - stop
          - restart
          - health
          - diagnose
          - rollback
          - handover
          - remigrate
          title: Operation
          type: string
        payload:
          anyOf:
          - discriminator:
              mapping:
                configure: '#/components/schemas/ConfigurePayload'
                gateway: '#/components/schemas/GatewayLifecyclePayload'
                handover: '#/components/schemas/HandoverPayload'
                install: '#/components/schemas/InstallPayload'
                probe: '#/components/schemas/ProbePayload'
                remigrate: '#/components/schemas/RemigratePayload'
                rollback: '#/components/schemas/RollbackPayload'
                upgrade: '#/components/schemas/UpgradePayload'
              propertyName: kind
            oneOf:
            - $ref: '#/components/schemas/InstallPayload'
            - $ref: '#/components/schemas/UpgradePayload'
            - $ref: '#/components/schemas/ConfigurePayload'
            - $ref: '#/components/schemas/GatewayLifecyclePayload'
            - $ref: '#/components/schemas/ProbePayload'
            - $ref: '#/components/schemas/HandoverPayload'
            - $ref: '#/components/schemas/RollbackPayload'
            - $ref: '#/components/schemas/RemigratePayload'
          - type: 'null'
          title: Payload
        releaseId:
          anyOf:
          - type: string
          - type: 'null'
          title: Releaseid
        requestedBy:
          title: Requestedby
          type: string
      required:
      - endpointId
      - minionId
      - operation
      - idempotencyKey
      - requestedBy
      title: JobCreateRequest
      type: object
    JobResponse:
      properties:
        acceptedAt:
          title: Acceptedat
          type: string
        conflictJobId:
          anyOf:
          - type: string
          - type: 'null'
          title: Conflictjobid
        correlationId:
          anyOf:
          - type: string
          - type: 'null'
          title: Correlationid
        duplicate:
          default: false
          title: Duplicate
          type: boolean
        endpointId:
          anyOf:
          - type: string
          - type: 'null'
          title: Endpointid
        errorCode:
          anyOf:
          - type: string
          - type: 'null'
          title: Errorcode
        jobId:
          title: Jobid
          type: string
        minionId:
          anyOf:
          - type: string
          - type: 'null'
          title: Minionid
        operation:
          anyOf:
          - type: string
          - type: 'null'
          title: Operation
        saltJid:
          anyOf:
          - type: string
          - type: 'null'
          title: Saltjid
        status:
          enum:
          - queued
          - dispatching
          - running
          - succeeded
          - failed
          - cancelled
          - expired
          title: Status
          type: string
      required:
      - jobId
      - status
      - acceptedAt
      title: JobResponse
      type: object
    JobReturnBatchRequest:
      properties:
        items:
          items:
            $ref: '#/components/schemas/JobReturnItem'
          title: Items
          type: array
        requestId:
          title: Requestid
          type: string
      required:
      - requestId
      - items
      title: JobReturnBatchRequest
      type: object
    JobReturnBatchResponse:
      properties:
        results:
          items:
            $ref: '#/components/schemas/JobReturnItemResult'
          title: Results
          type: array
      required:
      - results
      title: JobReturnBatchResponse
      type: object
    JobReturnItem:
      properties:
        endpointId:
          title: Endpointid
          type: string
        function:
          title: Function
          type: string
        jid:
          title: Jid
          type: string
        payloadRedacted:
          additionalProperties: true
          title: Payloadredacted
          type: object
        success:
          title: Success
          type: boolean
      required:
      - jid
      - endpointId
      - function
      - success
      title: JobReturnItem
      type: object
    JobReturnItemResult:
      properties:
        endpointId:
          title: Endpointid
          type: string
        function:
          title: Function
          type: string
        jid:
          title: Jid
          type: string
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        status:
          title: Status
          type: string
      required:
      - jid
      - endpointId
      - function
      - status
      title: JobReturnItemResult
      type: object
    ProbePayload:
      properties:
        kind:
          const: probe
          default: probe
          title: Kind
          type: string
        probe:
          default: health
          enum:
          - health
          - diagnose
          title: Probe
          type: string
      title: ProbePayload
      type: object
    RemigratePayload:
      properties:
        endpointId:
          anyOf:
          - type: string
          - type: 'null'
          title: Endpointid
        idempotencyKey:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotencykey
        kind:
          const: remigrate
          default: remigrate
          title: Kind
          type: string
      title: RemigratePayload
      type: object
    Ring0ApprovalRequest:
      properties:
        decision:
          default: approve
          title: Decision
          type: string
        reason:
          default: ''
          title: Reason
          type: string
        role:
          title: Role
          type: string
      required:
      - role
      title: Ring0ApprovalRequest
      type: object
    Ring0CreateRequest:
      properties:
        component:
          title: Component
          type: string
        configRevision:
          title: Configrevision
          type: string
        releaseId:
          title: Releaseid
          type: string
        requestId:
          title: Requestid
          type: string
        targets:
          items:
            additionalProperties: true
            type: object
          title: Targets
          type: array
        version:
          title: Version
          type: string
      required:
      - component
      - version
      - requestId
      - releaseId
      - configRevision
      title: Ring0CreateRequest
      type: object
    Ring0RollbackRequest:
      properties:
        endpointId:
          anyOf:
          - type: string
          - type: 'null'
          title: Endpointid
        reason:
          default: ''
          title: Reason
          type: string
        scope:
          default: target
          title: Scope
          type: string
      title: Ring0RollbackRequest
      type: object
    RollbackPayload:
      properties:
        kind:
          const: rollback
          default: rollback
          title: Kind
          type: string
        previousOwner:
          anyOf:
          - type: string
          - type: 'null'
          title: Previousowner
      title: RollbackPayload
      type: object
    RolloutActionRequest:
      properties:
        reason:
          title: Reason
          type: string
        requestId:
          title: Requestid
          type: string
      required:
      - requestId
      - reason
      title: RolloutActionRequest
      type: object
    RolloutApprovalRequest:
      properties:
        decision:
          default: approve
          title: Decision
          type: string
        reason:
          default: ''
          title: Reason
          type: string
        requestId:
          title: Requestid
          type: string
      required:
      - requestId
      title: RolloutApprovalRequest
      type: object
    RolloutCreateRequest:
      properties:
        component:
          title: Component
          type: string
        filters:
          additionalProperties: true
          default: {}
          title: Filters
          type: object
        reason:
          default: ''
          title: Reason
          type: string
        requestId:
          title: Requestid
          type: string
        ring:
          title: Ring
          type: string
        thresholds:
          additionalProperties: true
          default: {}
          title: Thresholds
          type: object
        version:
          title: Version
          type: string
      required:
      - component
      - version
      - ring
      - requestId
      title: RolloutCreateRequest
      type: object
    RolloutResponse:
      properties:
        approvalRequired:
          default: true
          title: Approvalrequired
          type: boolean
        batchSize:
          default: 0
          title: Batchsize
          type: integer
        completedCount:
          default: 0
          title: Completedcount
          type: integer
        component:
          title: Component
          type: string
        failureRate:
          default: 0.0
          title: Failurerate
          type: number
        p0Count:
          default: 0
          title: P0Count
          type: integer
        p1Count:
          default: 0
          title: P1Count
          type: integer
        ring:
          title: Ring
          type: string
        rollbackRate:
          default: 0.0
          title: Rollbackrate
          type: number
        rolloutId:
          title: Rolloutid
          type: string
        state:
          title: State
          type: string
        successRate:
          default: 0.0
          title: Successrate
          type: number
        targetCount:
          default: 0
          title: Targetcount
          type: integer
        thresholds:
          additionalProperties: true
          default: {}
          title: Thresholds
          type: object
        version:
          title: Version
          type: string
      required:
      - rolloutId
      - component
      - version
      - ring
      - state
      title: RolloutResponse
      type: object
    SecretResolveRequest:
      properties:
        endpointId:
          title: Endpointid
          type: string
        refs:
          items:
            type: string
          title: Refs
          type: array
        requestId:
          title: Requestid
          type: string
        userId:
          title: Userid
          type: string
      required:
      - endpointId
      - userId
      - requestId
      - refs
      title: SecretResolveRequest
      type: object
    SecretResolveResponse:
      properties:
        secrets:
          items:
            $ref: '#/components/schemas/SecretValue'
          title: Secrets
          type: array
      required:
      - secrets
      title: SecretResolveResponse
      type: object
    SecretValue:
      properties:
        ref:
          title: Ref
          type: string
        status:
          default: ok
          title: Status
          type: string
        value:
          title: Value
          type: string
      required:
      - ref
      - value
      title: SecretValue
      type: object
    UpgradePayload:
      properties:
        artifactUrl:
          anyOf:
          - type: string
          - type: 'null'
          title: Artifacturl
        kind:
          const: upgrade
          default: upgrade
          title: Kind
          type: string
        sha256:
          anyOf:
          - type: string
          - type: 'null'
          title: Sha256
        version:
          anyOf:
          - type: string
          - type: 'null'
          title: Version
      title: UpgradePayload
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
info:
  title: SMC Salt Control
  version: 1.0.0
openapi: 3.1.0
paths:
  /salt/v1/artifacts/{component}/{version}:
    get:
      operationId: get_artifact_salt_v1_artifacts__component___version__get
      parameters:
      - in: path
        name: component
        required: true
        schema:
          title: Component
          type: string
      - in: path
        name: version
        required: true
        schema:
          title: Version
          type: string
      - in: query
        name: platform
        required: false
        schema:
          default: windows
          title: Platform
          type: string
      - in: query
        name: arch
        required: false
        schema:
          default: AMD64
          title: Arch
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactMetadataResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Artifact
      tags:
      - artifacts
  /salt/v1/endpoints/{endpoint_id}/desired-state:
    get:
      operationId: get_desired_state_salt_v1_endpoints__endpoint_id__desired_state_get
      parameters:
      - in: path
        name: endpoint_id
        required: true
        schema:
          title: Endpoint Id
          type: string
      - in: query
        name: knownRevision
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Knownrevision
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesiredStateResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Desired State
      tags:
      - desired-state
  /salt/v1/endpoints/{endpoint_id}/status:
    get:
      operationId: endpoint_status_salt_v1_endpoints__endpoint_id__status_get
      parameters:
      - in: path
        name: endpoint_id
        required: true
        schema:
          title: Endpoint Id
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointStatusResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Endpoint Status
      tags:
      - jobs
  /salt/v1/enrollments:
    post:
      operationId: create_enrollment_salt_v1_enrollments_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentCreateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentCreateResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Create Enrollment
      tags:
      - enrollments
  /salt/v1/enrollments/{enrollment_id}:
    get:
      operationId: get_enrollment_salt_v1_enrollments__enrollment_id__get
